---
apiVersion: v1
kind: Service
metadata:
  name: aap-growth
  namespace: aap
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - port: 443
      protocol: TCP
      targetPort: 443
      name: https

    - port: 5432
      protocol: TCP
      targetPort: 5432
      name: pgsql

    - port: 8080
      protocol: TCP
      targetPort: 8080
      name: http

    - port: 8446
      protocol: TCP
      targetPort: 8446
      name: gateway
  selector:
    vm: aap
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  annotations:
  name: aap-growth
  namespace: aap
spec:
  host: aap-growth.apps.hetzner.tntinfra.net
  port:
    targetPort: 443
  tls:
    insecureEdgeTerminationPolicy: None
    termination: passthrough
  to:
    kind: Service
    name: aap-growth
    weight: 100
  wildcardPolicy: None
